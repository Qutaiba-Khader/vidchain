name: CI

# Pull requests and pushes to main. No secrets: nothing here can sign, tag or publish.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  ACTIONLINT_VERSION: 1.7.12
  ZIZMOR_VERSION: 1.30.1
  MITMPROXY_VERSION: 12.2.3
  YTDLP_VERSION: 2026.8.19

jobs:
  gates:
    name: Source gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: upstream/ snapshot matches VENDORED_FROM
        run: tools/vendor.sh

      - name: Drift check (every change versus upstream/ is declared)
        run: python3 tools/drift_check.py

      - name: Rename audit (VidChain identity)
        run: python3 tools/rename_audit.py

      - name: Removed-features gate (ads, tracking, updater, kill switch, cloud sync)
        run: python3 tools/removed_check.py

      - name: Leak gate (project-specific forbidden tokens)
        run: python3 tools/leak_gate.py

      - name: gitleaks (whole history)
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact .

      - name: Workflow policy, actionlint, zizmor
        run: |
          python3 tools/workflow_policy.py
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
          pipx run "zizmor==${ZIZMOR_VERSION}" --offline --min-severity medium .github/workflows

      - name: Flow-tracing records (verdict ledger, frozen findings)
        run: python3 tools/ledger_check.py

      - name: Gate self-test (every gate must fail on a seeded violation)
        run: tools/gate_selftest.sh

  build:
    name: Build (unsigned for release) + APK gates
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build release APKs (throwaway CI key, never published)
        run: |
          # upstream gradle.properties caps the daemon at 2 GB; packaging the 241 MB universal APK + lint needs more
          mkdir -p ~/.gradle && echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -storetype PKCS12 -storepass ci-only -keypass ci-only \
            -alias ci -keyalg RSA -keysize 2048 -validity 1 -dname "CN=VidChain CI throwaway" >/dev/null 2>&1
          chmod +x gradlew
          # lint: inherited findings are frozen in app/lint-baseline-vidchain.xml; new lint errors fail here
          ./gradlew --no-daemon assembleRelease lintRelease testReleaseUnitTest \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/ci.jks" \
            -Pandroid.injected.signing.store.password=ci-only \
            -Pandroid.injected.signing.key.alias=ci \
            -Pandroid.injected.signing.key.password=ci-only
          rm -f "$RUNNER_TEMP/ci.jks"

      - name: APK gate (package, deny-list, stub sentinel)
        run: tools/apk_check.sh app/build/outputs/apk/release

      - name: APK gate negative control (a planted developer host must be caught)
        run: |
          mkdir -p "$RUNNER_TEMP/neg"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "$RUNNER_TEMP/neg/"
          printf 'https://cloud.%s.com/\n' tubeaio > "$RUNNER_TEMP/planted.txt"
          (cd "$RUNNER_TEMP" && zip -q neg/app-arm64-v8a-release.apk planted.txt)
          if tools/apk_check.sh "$RUNNER_TEMP/neg"; then echo "::error::APK gate missed a planted host"; exit 1; fi
          echo "caught: planted developer host"

      - name: Size budget per ABI
        run: python3 tools/size_budget.py app/build/outputs/apk/release

      - name: Keep the x86_64 and arm64 APKs for the emulator jobs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: apk-ci
          path: |
            app/build/outputs/apk/release/app-x86_64-release.apk
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
          retention-days: 7
          if-no-files-found: error

  fixture-cross-exam:
    name: Fixture world cross-examination (curl, ffprobe, yt-dlp, node)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Reference tools
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg >/dev/null
          pipx install "mitmproxy==${MITMPROXY_VERSION}"
          pipx install "yt-dlp==${YTDLP_VERSION}"

      - name: Generate media, start the fixture world
        run: |
          bash ci/fixtures/world/gen_media.sh "$RUNNER_TEMP/media" >/dev/null
          FIXTURE_MEDIA="$RUNNER_TEMP/media" FIXTURE_FLOW_LOG="$RUNNER_TEMP/flows.jsonl" nohup mitmdump --listen-host 127.0.0.1 -p 8080 \
            -s ci/fixtures/world/world.py --set connection_strategy=lazy > "$RUNNER_TEMP/mitm.log" 2>&1 &
          for _ in $(seq 1 30); do [ -f ~/.mitmproxy/mitmproxy-ca-cert.pem ] && break; sleep 1; done

      - name: Every fixture's expected outcome, confirmed by tools the app does not share
        run: python3 ci/fixtures/world/cross_exam.py ~/.mitmproxy/mitmproxy-ca-cert.pem cross-exam.json

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: cross-exam
          path: cross-exam.json
          retention-days: 14

  golden-twin:
    name: Golden twin + fault matrix (unchanged app in the fixture world)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: apk-ci
          path: apk

      - name: Enable KVM, generate media, start the fixture world
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg >/dev/null
          pipx install "mitmproxy==${MITMPROXY_VERSION}"
          bash ci/fixtures/world/gen_media.sh "$RUNNER_TEMP/media" >/dev/null
          echo '{}' > "$RUNNER_TEMP/faults.json"
          FIXTURE_MEDIA="$RUNNER_TEMP/media" FIXTURE_FLOW_LOG="$RUNNER_TEMP/flows.jsonl" FIXTURE_FAULTS_FILE="$RUNNER_TEMP/faults.json" \
            nohup mitmdump --listen-host 127.0.0.1 -p 8080 -s ci/fixtures/world/world.py --set connection_strategy=lazy > "$RUNNER_TEMP/mitm.log" 2>&1 &
          for _ in $(seq 1 30); do [ -f ~/.mitmproxy/mitmproxy-ca-cert.pem ] && break; sleep 1; done
          cp ~/.mitmproxy/mitmproxy-ca-cert.pem "$RUNNER_TEMP/fixture-ca.pem"

      - name: Drive every fixture, then every fault, through the unchanged app
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -writable-system -http-proxy http://127.0.0.1:8080
          script: |
            bash ci/emulator/fixture_env.sh apk/app-x86_64-release.apk ${{ runner.temp }}/fixture-ca.pem
            python3 ci/emulator/drive.py ci/golden/scenarios-golden.json golden-out ${{ runner.temp }}/faults.json
            python3 ci/emulator/drive.py ci/golden/scenarios-golden.json golden-out2 ${{ runner.temp }}/faults.json
            python3 ci/emulator/drive.py ci/golden/scenarios-faults.json faults-out ${{ runner.temp }}/faults.json

      - name: Canonicalise
        run: |
          python3 ci/golden/canonicalise.py golden-out/outcomes.json "$RUNNER_TEMP/flows.jsonl" golden-out/pass1.json
          python3 ci/golden/canonicalise.py golden-out2/outcomes.json "$RUNNER_TEMP/flows.jsonl" golden-out/pass2.json
          python3 ci/golden/stability.py golden-out/pass1.json golden-out/pass2.json golden-out/golden.json
          python3 ci/golden/canonicalise.py faults-out/outcomes.json "$RUNNER_TEMP/flows.jsonl" faults-out/fault-matrix.json
          cp "$RUNNER_TEMP/flows.jsonl" golden-out/flows.jsonl

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: golden-twin
          path: |
            golden-out/
            golden-out2/outcomes.json
            faults-out/
          retention-days: 30
