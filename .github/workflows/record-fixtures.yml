name: Record fixtures

# Records cassettes (real responses of openly licensed pages listed in ci/fixtures/cassettes/sources.json)
# with sha256, date, tool version and this run's URL. The artifact is reviewed and committed; CI replays it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Record every source
        run: python3 ci/fixtures/record.py ci/fixtures/cassettes
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cassettes
          path: ci/fixtures/cassettes/
          retention-days: 30
