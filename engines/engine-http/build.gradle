// VidChain HTTP engine (new code, not upstream): the plain GET fetcher behind method O (T2.1) and the
// HTTP helpers later methods share (redirect unwrap, file-host resolvers).
plugins {
	id 'com.android.library'
	id 'org.jetbrains.kotlin.android'
}

android {
	namespace "org.websnake.vidchain.http"
	compileSdk 36
	defaultConfig {
		minSdk 28
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
	testOptions {
		unitTests.returnDefaultValues = true
	}
	lint {
		abortOnError true
		disable "NewerVersionAvailable", "GradleDependency", "AndroidGradlePluginVersion"
	}
}

kotlin {
	jvmToolchain(17)
}

dependencies {
	implementation libs.kotlin.coroutines.core
	implementation libs.kotlin.coroutines.android
	implementation libs.okhttp
	testImplementation "junit:junit:4.13.2"
}
