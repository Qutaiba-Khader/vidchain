// VidChain yt-dlp engine (new code, not upstream): runs the yt-dlp the library already ships, on its bundled
// Python, through the engine runner (methods Y, C, S with an extractor, N later). T2.4.
plugins {
	id 'com.android.library'
	id 'org.jetbrains.kotlin.android'
}

android {
	namespace "org.websnake.vidchain.ytdlp"
	compileSdk 36
	defaultConfig {
		minSdk 28
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
	testOptions {
		unitTests.returnDefaultValues = true
	}
	lint {
		abortOnError true
		disable "NewerVersionAvailable", "GradleDependency", "AndroidGradlePluginVersion"
	}
}

kotlin {
	jvmToolchain(17)
}

dependencies {
	implementation libs.kotlin.coroutines.core
	implementation libs.kotlin.coroutines.android
	api project(':engines:engine-process')
	testImplementation "org.json:json:20250517"
	testImplementation "junit:junit:4.13.2"
}
