// VidChain fallback core (new code; never part of the upstream app). Pure Kotlin logic first:
// the TerminalClassifier (T1.5), trace logger (T1.6), coordinator + attempt ledger (T1.7), DeliveryVerifier (T1.8),
// engine kit (T1.9) and the fallback UI (T1.10).
plugins {
	id 'com.android.library'
	id 'org.jetbrains.kotlin.android'
}

android {
	namespace "org.websnake.vidchain.fallback"
	compileSdk 36
	defaultConfig {
		minSdk 28
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
	testOptions {
		unitTests.returnDefaultValues = true
	}
	lint {
		abortOnError true
		disable "NewerVersionAvailable", "GradleDependency", "AndroidGradlePluginVersion"
	}
}

kotlin {
	jvmToolchain(17)
}

dependencies {
	api project(':engines:engine-process')
	api project(':engines:engine-http')
	api project(':engines:engine-ytdlp')
	api project(':engines:engine-hosts')
	api project(':engines:engine-web')
	api project(':engines:engine-media3')
	implementation libs.okhttp
	implementation libs.kotlin.coroutines.core
	implementation libs.kotlin.coroutines.android
	implementation libs.androidx.appcompat
	implementation "io.github.junkfood02.youtubedl-android:aria2c:0.18.1"   // method A: same library family and version as yt-dlp/ffmpeg
	implementation libs.newpipe.extractor   // method P reads the streams of the NewPipe instance the app already set up
	testImplementation "junit:junit:4.13.2"
	testImplementation "org.json:json:20250517"   // real org.json in JVM tests (android.jar only has stubs)
}

// CI logs show why a test failed, not only where
tasks.withType(Test).configureEach {
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

// The Python engines zip (T5.3): pinned pure wheels + aio_engine, built from python/requirements.lock into the assets
def pyzipDir = layout.buildDirectory.dir("generated/pyzip/assets")
def pyzipFile = pyzipDir.map { it.file("vidchain-py.zip") }
tasks.register("buildPyZip", Exec) {
	inputs.file(rootProject.file("python/requirements.lock"))
	inputs.dir(rootProject.file("python/aio_engine"))
	inputs.dir(rootProject.file("python/dukpy"))
	inputs.dir(rootProject.file("python/lxml"))
	inputs.dir(rootProject.file("python/pycountry"))
	inputs.file(rootProject.file("python/streamlink-plugins.json"))
	inputs.file(rootProject.file("tools/build_pyzip.py"))
	outputs.file(pyzipFile)
	commandLine "python3", rootProject.file("tools/build_pyzip.py").path, "--out", pyzipFile.get().asFile.path
}
android.sourceSets.main.assets.srcDir(pyzipDir)
tasks.named("preBuild") { dependsOn "buildPyZip" }
tasks.withType(Test).configureEach {
	dependsOn "buildPyZip"
	systemProperty "vidchain.pyzip", pyzipFile.get().asFile.path
}
