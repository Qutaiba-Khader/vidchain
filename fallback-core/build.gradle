// VidChain fallback core (new code; never part of the upstream app). Pure Kotlin logic first:
// the TerminalClassifier (T1.5), the trace logger (T1.6), the coordinator + attempt ledger (T1.7); the verifier follows in T1.8.
plugins {
	id 'com.android.library'
	id 'org.jetbrains.kotlin.android'
}

android {
	namespace "org.websnake.vidchain.fallback"
	compileSdk 36
	defaultConfig {
		minSdk 28
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
	testOptions {
		unitTests.returnDefaultValues = true
	}
	lint {
		abortOnError true
		disable "NewerVersionAvailable", "GradleDependency", "AndroidGradlePluginVersion"
	}
}

kotlin {
	jvmToolchain(17)
}

dependencies {
	implementation libs.kotlin.coroutines.core
	implementation libs.kotlin.coroutines.android
	testImplementation "junit:junit:4.13.2"
}
