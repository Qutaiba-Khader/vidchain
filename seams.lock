# FALLBACK-SEAM ledger: the only upstream-origin hunks the fallback system may add.
# Each seam is one added line marked `// FALLBACK-SEAM:<id>`; tools/seam_check.py proves that every `modified`
# file below differs from upstream/ ONLY by such added lines (no removed or changed upstream line).
# Format of the paths block: <modified|added> <repo-relative path>
#
# Seams (T1.5, T1.7, T1.9, T1.10, T2.1, T2.4, T3.1, T3.2, T3.6):
#   settings.gradle            module        include ':fallback-core'
#   settings.gradle            module-engine include ':engines:engine-process' (T1.9)
#   settings.gradle            module-http   include ':engines:engine-http' (T2.1)
#   settings.gradle            module-ytdlp  include ':engines:engine-ytdlp' (T2.4)
#   settings.gradle            module-hosts  include ':engines:engine-hosts' (T3.1)
#   settings.gradle            module-web    include ':engines:engine-web' (T3.2)
#   settings.gradle            module-media3 include ':engines:engine-media3' (T3.6)
#   app/build.gradle           dep           implementation project(':fallback-core')   (file declared in BRANDING.md)
#   AIOApp.kt                  start         FallbackSeams.appStarted(...) right after `INSTANCE = this` in onCreate
#   AIOApp.kt                  shutdown      FallbackSeams.appShutdown() before downloadSystem.pauseAllDownloads() in onTerminate
#   ActiveTasksOptions.kt      resume        user intent RESUME before downloadSystem.resumeDownload(...)
#   ActiveTasksOptions.kt      pause-confirm user intent PAUSE before downloadSystem.pauseDownload (confirm dialog)
#   ActiveTasksOptions.kt      pause         user intent PAUSE before downloadSystem.pauseDownload
#   ActiveTasksOptions.kt      clear         user intent CLEAR before downloadSystem.clearDownload
#   ActiveTasksOptions.kt      delete        user intent DELETE before downloadSystem.deleteDownload
#   DownloadFileRenamer.kt     rename-pause  intent RENAME_PAUSE before the app pauses a download to rename it
#   DownloadUIManager.kt       row           fallback trail line on a download card, after the row is updated
#   ActiveTasksOptions.kt      options       "Try another method" + "Methods tried" in the options dialog
#   SettingsFragment.kt        settings      the "VidChain fallbacks" row, cloned after the advanced-downloads row
#   SharedVideoURLIntercept.kt share-text    a shared text that is not a link: re-enter with the first link in it
#   SharedVideoURLIntercept.kt share-rejected link not on the app's list: VidChain asks yt-dlp (picker if found)
#   SharedVideoURLIntercept.kt share-empty   the app's analysis found no formats: the same yt-dlp rescue
# The added adapter VidChainFallbackHost.kt (new file inside the upstream source tree) only reads the download
# lists and adds child downloads through DownloadSystem.addDownload.
